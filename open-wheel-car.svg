<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="carTitle">
  <title id="carTitle">TurboTutor Formula-style racing car in red livery</title>
  <defs>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4234"/>
      <stop offset=".42" stop-color="#e10600"/>
      <stop offset="1" stop-color="#8a0300"/>
    </linearGradient>
    <linearGradient id="carBodyDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c0400"/>
      <stop offset="1" stop-color="#630200"/>
    </linearGradient>
    <linearGradient id="carDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a434d"/>
      <stop offset="1" stop-color="#101418"/>
    </linearGradient>
    <linearGradient id="carRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset=".5" stop-color="#bcc6d1"/>
      <stop offset="1" stop-color="#78838f"/>
    </linearGradient>
    <radialGradient id="carTyre" cx=".34" cy=".26" r=".88">
      <stop offset="0" stop-color="#4a545f"/>
      <stop offset=".68" stop-color="#171c21"/>
      <stop offset="1" stop-color="#080b0e"/>
    </radialGradient>
    <linearGradient id="carVisor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f7d8a"/>
      <stop offset="1" stop-color="#161c22"/>
    </linearGradient>
    <style>
      @keyframes carWheel { to { transform: rotate(360deg); } }
      .car-wheel-spin { transform-box: fill-box; transform-origin: center; animation: carWheel 1.9s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .car-wheel-spin { animation: none; } }
    </style>
  </defs>

  <ellipse cx="420" cy="262" rx="352" ry="16" fill="#000" opacity=".34"/>

  <g fill="#ffffff" opacity=".14">
    <rect x="6" y="128" width="96" height="6" rx="3"/>
