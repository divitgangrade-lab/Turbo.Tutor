<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-labelledby="carTitle carDesc">
  <title id="carTitle">TurboTutor Formula 1 car in red and carbon livery</title>
  <desc id="carDesc">Side profile of a ground-effect Formula 1 car with a titanium halo, pushrod suspension, venturi floor, carbon-fibre wings and yellow-marked slick tyres.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a55"/>
      <stop offset=".22" stop-color="#f01408"/>
      <stop offset=".66" stop-color="#bd0500"/>
      <stop offset="1" stop-color="#6b0200"/>
    </linearGradient>
    <linearGradient id="shellSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf0a00"/>
      <stop offset="1" stop-color="#720200"/>
    </linearGradient>
    <linearGradient id="carbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333b42"/>
      <stop offset="1" stop-color="#0e1215"/>
    </linearGradient>
    <linearGradient id="tyre" x1=".25" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#343a40"/>
      <stop offset=".45" stop-color="#171b1f"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8ec"/>
      <stop offset=".5" stop-color="#98a2a9"/>
      <stop offset="1" stop-color="#394148"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b969e"/>
      <stop offset="1" stop-color="#1b2126"/>
    </linearGradient>
    <radialGradient id="contact" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".5"/>
      <stop offset=".7" stop-color="#000" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#1b2126"/>
      <rect width="3" height="3" fill="#272f36"/>
      <rect x="3" y="3" width="3" height="3" fill="#12171b"/>
    </pattern>
  </defs>

  <ellipse cx="430" cy="290" rx="336" ry="15" fill="url(#contact)"/>

  <!-- rear wing assembly, connected to the body by its pylon -->
  <path d="M58 112 C58 107 62 104 67 104 L138 102 C146 102 152 107 152 114 L152 190 L60 190 L58 184 Z" fill="#151b20"/>
  <path d="M67 118 L150 112 L150 126 L67 132 Z" fill="#252d34"/>
  <path d="M69 132 L152 126 L152 143 L69 149 Z" fill="url(#shell)"/>
  <path d="M150 143 L150 158 L69 164 L69 149 Z" fill="#1b2127"/>
  <path d="M60 160 L70 160 L70 182 L60 182 Z" fill="#ffd400"/>
  <text x="65" y="177" font-family="'Arial Black', Arial, sans-serif" font-size="10" font-weight="900" fill="#14181c">TT</text>
  <path d="M152 156 L200 190 L192 199 L152 176 Z" fill="#1a2026"/>
  <path d="M148 198 L204 192 L206 202 L150 208 Z" fill="#1a2026"/>
  <rect x="98" y="106" width="18" height="8" rx="2" fill="#080b0e"/>
  <path d="M152 112 L170 110" stroke="#ffd400" stroke-width="2" opacity=".8"/>

  <!-- one continuous chassis from rear deck to nose tip -->
  <path d="M150 206 C176 186 212 176 248 170 C292 158 332 146 374 138 C400 133 422 134 438 141 C454 137 468 139 480 149 C502 161 522 169 550 177 C592 189 642 195 692 201 L800 209 C812 211 817 219 807 225 C781 231 741 235 701 239 L701 247 L214 251 C184 249 162 236 150 220 Z" fill="url(#shell)"/>
  <path d="M150 206 C176 186 212 176 248 170 C292 158 332 146 374 138" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2.4"/>
  <path d="M214 251 C240 236 300 226 360 218 C430 209 520 204 600 208 L701 239" fill="none" stroke="#ffd400" stroke-opacity=".5" stroke-width="2"/>

  <!-- airbox and cockpit -->
  <path d="M398 140 C400 124 414 116 430 119 C444 122 450 132 450 144 L436 146 C432 138 418 136 410 144 Z" fill="url(#shellSide)"/>
  <path d="M411 126 C418 121 428 122 433 128 L432 136 C426 132 418 132 414 136 Z" fill="#080b0e"/>
  <path d="M438 150 C450 144 472 143 486 149 L498 162 C478 156 454 157 438 164 Z" fill="#080b0e"/>
  <circle cx="462" cy="155" r="10" fill="#ffd400"/>
  <path d="M452 155 C454 148 470 147 472 155 L472 159 C464 156 458 156 452 159 Z" fill="#e10600"/>
  <path d="M455 152 C460 150 465 150 469 152 L468 156 C463 154 459 154 456 156 Z" fill="#161b20"/>
  <path d="M421 165 C429 141 477 137 497 161" fill="none" stroke="url(#halo)" stroke-width="9" stroke-linecap="round"/>
  <path d="M421 165 C429 141 477 137 497 161" fill="none" stroke="#b9c3ca" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>

  <!-- sidepod, inlet and undercut -->
  <path d="M486 178 C522 172 560 181 586 199 L600 240 L474 246 Z" fill="url(#shellSide)"/>
  <path d="M556 188 C570 186 580 190 588 198 L574 202 C564 195 556 193 548 195 Z" fill="#080b0e"/>
  <path d="M556 188 C570 186 580 190 588 198" fill="none" stroke="#ffd400" stroke-width="2" opacity=".9"/>
  <path d="M474 246 C520 238 566 234 600 236" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>

  <!-- carbon floor, venturi fences and skid block -->
  <path d="M206 246 L700 242 L708 250 L212 254 Z" fill="url(#weave)"/>
  <path d="M470 244 L468 254 M494 244 L492 254 M518 244 L516 254 M542 244 L540 254" stroke="#39424a" stroke-width="2" opacity=".9"/>
  <rect x="318" y="248" width="52" height="5" fill="#5c6469"/>
  <path d="M206 246 L700 242" stroke="#454f56" stroke-width="1.2"/>

  <!-- front wing attached to the nose -->
  <path d="M786 208 L808 210 L808 254 L790 252 Z" fill="#141a1f"/>
  <path d="M800 210 L808 211 L808 252 L802 252 Z" fill="#ffd400" opacity=".85"/>
  <path d="M700 240 L806 234 L807 244 L704 250 Z" fill="url(#weave)"/>
  <path d="M712 230 L804 224 L805 233 L714 239 Z" fill="url(#shell)"/>
  <path d="M724 221 L802 216 L802 223 L726 228 Z" fill="#1c2329"/>
  <path d="M760 210 L804 207" stroke="#ffd400" stroke-width="2" opacity=".7"/>

  <!-- wheels -->
  <g>
    <circle cx="230" cy="230" r="55" fill="url(#tyre)"/>
    <circle cx="230" cy="230" r="55" fill="none" stroke="#050607" stroke-width="2.4"/>
    <circle cx="230" cy="230" r="49" fill="none" stroke="#2c3237" stroke-width="1.2" opacity=".8"/>
    <circle cx="230" cy="230" r="45" fill="none" stroke="#ffd400" stroke-width="2.4" opacity=".9"/>
    <circle cx="230" cy="230" r="31" fill="#14191d"/>
    <circle cx="230" cy="230" r="23" fill="url(#rim)"/>
    <circle cx="230" cy="230" r="16" fill="#22282d"/>
    <g stroke="#8b959c" stroke-width="6" stroke-linecap="round" opacity=".95">
      <path d="M230 224 V209"/><path d="M235 226 L247 216"/><path d="M237 232 L251 232"/><path d="M235 238 L247 246"/><path d="M230 241 V251"/><path d="M224 238 L213 246"/><path d="M222 232 L209 232"/><path d="M224 226 L213 216"/>
    </g>
    <circle cx="230" cy="230" r="8" fill="#d3dade"/>
    <circle cx="230" cy="230" r="3" fill="#171c20"/>
  </g>
  <g>
    <circle cx="628" cy="232" r="50" fill="url(#tyre)"/>
    <circle cx="628" cy="232" r="50" fill="none" stroke="#050607" stroke-width="2.2"/>
    <circle cx="628" cy="232" r="44" fill="none" stroke="#2c3237" stroke-width="1.2" opacity=".8"/>
    <circle cx="628" cy="232" r="41" fill="none" stroke="#ffd400" stroke-width="2.2" opacity=".9"/>
    <circle cx="628" cy="232" r="28" fill="#14191d"/>
    <circle cx="628" cy="232" r="21" fill="url(#rim)"/>
    <circle cx="628" cy="232" r="14" fill="#22282d"/>
    <g stroke="#8b959c" stroke-width="5.4" stroke-linecap="round" opacity=".95">
      <path d="M628 226 V212"/><path d="M633 228 L643 219"/><path d="M635 233 L647 233"/><path d="M633 238 L643 246"/><path d="M628 241 V251"/><path d="M623 238 L613 246"/><path d="M621 233 L609 233"/><path d="M623 228 L613 219"/>
    </g>
    <circle cx="628" cy="232" r="7" fill="#d3dade"/>
    <circle cx="628" cy="232" r="2.6" fill="#171c20"/>
  </g>

  <!-- pushrod suspension and steering arms -->
  <path d="M570 196 L614 213 L608 220 L564 203 Z" fill="#1b2126"/>
  <path d="M562 240 L616 251 L614 257 L558 247 Z" fill="#1b2126"/>
  <path d="M572 218 L616 235" stroke="#2e373e" stroke-width="4"/>
  <path d="M186 198 L226 212 L220 219 L180 205 Z" fill="#1b2126"/>
  <path d="M180 240 L230 250 L228 256 L176 247 Z" fill="#1b2126"/>
  <path d="M190 218 L228 233" stroke="#2e373e" stroke-width="4"/>

  <!-- mirrors, antenna, exhaust -->
  <path d="M504 166 L520 162 L522 171 L507 175 Z" fill="#0d1114"/>
  <path d="M520 162 L522 171" stroke="#ffd400" stroke-width="2"/>
  <path d="M404 132 L402 117" stroke="#2b3339" stroke-width="2"/>
  <circle cx="402" cy="116" r="1.8" fill="#ffd400"/>
  <circle cx="166" cy="214" r="6" fill="#3b4248"/>
  <circle cx="166" cy="214" r="3" fill="#0a0d0f"/>

  <!-- livery -->
  <rect x="512" y="196" width="34" height="20" fill="#f7f5f0"/>
  <text x="529" y="211" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-size="13" font-weight="900" fill="#e10600">TT</text>
  <text x="300" y="184" font-family="'Arial Narrow', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.6" fill="#fff" opacity=".9" transform="rotate(-7 300 184)">TURBO TUTOR</text>
  <text x="752" y="220" font-family="'Arial Black', Arial, sans-serif" font-size="11" fill="#fff" opacity=".9">07</text>
  <path d="M214 251 C300 226 420 212 540 210" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="3"/>
</svg>
