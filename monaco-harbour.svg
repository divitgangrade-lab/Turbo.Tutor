<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="harbourTitle harbourDesc">
  <title id="harbourTitle">Monaco harbour circuit illustration</title>
  <desc id="harbourDesc">Terraced Belle Epoque buildings above Port Hercule, multi-deck superyachts on rippling water, the pool complex, green and white Armco barriers and a street circuit running through the foreground.</desc>
  <defs>
