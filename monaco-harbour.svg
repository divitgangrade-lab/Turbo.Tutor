      <stop offset="0" stop-color="#a9cede"/><stop offset=".55" stop-color="#d8e3e2"/><stop offset="1" stop-color="#f6e6c9"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a7f97"/><stop offset=".45" stop-color="#136078"/><stop offset="1" stop-color="#083548"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#eef2f3"/><stop offset="1" stop-color="#c6d1d6"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f9fa"/><stop offset="1" stop-color="#d3dde1"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3438"/><stop offset="1" stop-color="#191d21"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd4e4"/><stop offset="1" stop-color="#2f9dba"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity=".95"/><stop offset=".45" stop-color="#ffe9a8" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="win" width="16" height="20" patternUnits="userSpaceOnUse">
      <rect width="16" height="20" fill="none"/><rect x="3" y="4" width="7" height="9" fill="#39474f" opacity=".62"/>
    </pattern>
    <pattern id="grit" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="none"/><rect x="1" y="1" width="1.4" height="1.2" fill="#5a6165" opacity=".5"/><rect x="4" y="4" width="1.2" height="1" fill="#0f1215" opacity=".6"/>
    </pattern>
    <style>
      @keyframes shimmer { 0%, 100% { opacity: .3; } 50% { opacity: .95; } }
      .glint ellipse { animation: shimmer 5.5s ease-in-out infinite; }
      .glint ellipse:nth-child(2n) { animation-delay: 1.6s; }
      .glint ellipse:nth-child(3n) { animation-delay: 3.1s; }
      @media (prefers-reduced-motion: reduce) { .glint ellipse { animation: none; } }
    </style>
  </defs>

