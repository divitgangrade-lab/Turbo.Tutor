<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" role="img" aria-labelledby="kartTitle">
  <title id="kartTitle">A red and yellow go-kart</title>
  <defs>
    <linearGradient id="kartRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4234"/>
      <stop offset="1" stop-color="#b00500"/>
    </linearGradient>
    <linearGradient id="kartDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a434d"/>
      <stop offset="1" stop-color="#11161a"/>
    </linearGradient>
    <radialGradient id="kartTyre" cx=".34" cy=".28" r=".9">
      <stop offset="0" stop-color="#454f5a"/>
      <stop offset=".7" stop-color="#171c21"/>
      <stop offset="1" stop-color="#07090b"/>
    </radialGradient>
    <style>
      @keyframes kartWheel { to { transform: rotate(360deg); } }
      .kart-wheel-spin { transform-box: fill-box; transform-origin: center; animation: kartWheel 2.4s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .kart-wheel-spin { animation: none; } }
    </style>
  </defs>

  <ellipse cx="222" cy="224" rx="196" ry="12" fill="#000" opacity=".16"/>

  <g fill="#14171b" opacity=".14">
    <rect x="8" y="128" width="58" height="5" rx="2.5"/>
    <rect x="24" y="146" width="40" height="4" rx="2"/>
    <rect x="0" y="164" width="34" height="4" rx="2"/>
  </g>

  <g class="kart-wheel-spin">
    <circle cx="330" cy="186" r="38" fill="url(#kartTyre)"/>
    <circle cx="330" cy="186" r="28" fill="#141a1f"/>
    <circle cx="330" cy="186" r="27" fill="none" stroke="#ffd400" stroke-width="3" stroke-dasharray="5 10"/>
    <circle cx="330" cy="186" r="16" fill="#bcc6d1"/>
    <circle cx="330" cy="186" r="5" fill="#e10600"/>
  </g>

  <path d="M64 202 C140 190 250 188 356 194 L360 208 C250 202 140 206 66 218 Z" fill="url(#kartDark)"/>
  <path d="M300 196 h58 v10 h-58 z" fill="#14171b"/>

  <g>
    <rect x="292" y="134" width="62" height="48" rx="6" fill="#2b333b"/>
    <g stroke="#96a1ac" stroke-width="3">
      <line x1="298" y1="144" x2="348" y2="144"/>
      <line x1="298" y1="154" x2="348" y2="154"/>
      <line x1="298" y1="164" x2="348" y2="164"/>
    </g>
    <rect x="352" y="142" width="18" height="14" rx="4" fill="#ffd400"/>
    <path d="M370 150 C392 146 400 158 412 154" fill="none" stroke="#8e99a4" stroke-width="7" stroke-linecap="round"/>
  </g>

  <path d="M212 196 C226 160 262 148 296 168 L300 196 Z" fill="#e10600"/>
  <path d="M228 186 C240 164 262 158 280 166 L284 186 Z" fill="#14171b" opacity=".8"/>
  <path d="M196 190 C208 174 214 166 218 158 L236 162 C230 178 228 188 226 196 Z" fill="url(#kartRed)"/>
  <path d="M226 194 C258 182 300 178 344 184 L348 194 C300 190 258 192 228 200 Z" fill="#ffd400"/>

  <path d="M104 196 C150 180 190 172 214 170 L216 184 C186 190 148 200 112 210 Z" fill="url(#kartRed)"/>

  <path d="M128 190 L166 142" stroke="#20262d" stroke-width="7" stroke-linecap="round"/>
  <g transform="translate(170 136) rotate(-24)">
    <ellipse rx="27" ry="9" fill="#141b21"/>
    <ellipse rx="27" ry="9" fill="none" stroke="#ffd400" stroke-width="3"/>
    <ellipse rx="6" ry="4" fill="#e10600"/>
  </g>

  <path d="M86 190 h16 v18 h-16 z" fill="#14171b"/>

  <g class="kart-wheel-spin">
    <circle cx="104" cy="196" r="24" fill="url(#kartTyre)"/>
    <circle cx="104" cy="196" r="15" fill="#141a1f"/>
    <circle cx="104" cy="196" r="14" fill="none" stroke="#ffd400" stroke-width="2.5" stroke-dasharray="4 8"/>
    <circle cx="104" cy="196" r="8" fill="#bcc6d1"/>
    <circle cx="104" cy="196" r="3" fill="#e10600"/>
  </g>

  <g transform="translate(258 206)">
    <circle r="17" fill="#ffd400"/>
    <circle r="17" fill="none" stroke="#14171b" stroke-width="3"/>
    <text y="7" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="20" font-weight="900" fill="#14171b" text-anchor="middle">TT</text>
  </g>

  <path d="M150 158 L186 154" stroke="#ffd400" stroke-width="6" stroke-linecap="round"/>
  <path d="M66 214 C140 204 250 200 356 206" fill="none" stroke="#ffffff" stroke-width="2" opacity=".35"/>
</svg>
