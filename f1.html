<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(120% 120% at 50% 20%, #1a1f26 0%, #0a0c0f 62%); color: #f7f5f0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .scene-shell { display: flex; flex-direction: column; height: 100%; }
  .scene-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.14); }
  .scene-bar a { color: #ffd400; text-decoration: none; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
  .scene-bar a:hover, .scene-bar a:focus-visible { text-decoration: underline; }
  .scene-title { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #c9ccd0; }
  .scene-stage { position: relative; flex: 1; min-height: 0; }
  spline-viewer { display: block; width: 100%; height: 100%; }
  .scene-note { position: absolute; inset: 0; display: grid; place-content: center; gap: 8px; padding: 24px; text-align: center; color: #9aa3ad; font-size: 14px; }
  .scene-note.is-hidden { display: none; }
  .scene-note strong { color: #f7f5f0; font-weight: 600; }
</style>
<script type="module" src="vendor/spline/spline-viewer.js"></script>
</head>
<body>
<div class="scene-shell">
  <header class="scene-bar">
    <a href="./">&larr; Back to TurboTutor</a>
    <h1 class="scene-title">TT-01 F1 scene</h1>
  </header>
  <main class="scene-stage">
    <spline-viewer id="f1-scene" url="vendor/spline/f1-scene.splinecode"></spline-viewer>
    <p class="scene-note" id="scene-note"><strong>Loading the F1 scene</strong><span>The 4.6 MB scene is downloaded once, then cached.</span></p>
  </main>
</div>
<script>
  const viewer = document.getElementById('f1-scene');
  const note = document.getElementById('scene-note');
  const hide = () => note.classList.add('is-hidden');
  viewer.addEventListener('load-complete', hide, { once: true });
  viewer.addEventListener('error', () => {
    note.innerHTML = '<strong>The scene could not start</strong><span>Your browser may not support WebGL. <a href="./">Back to the site</a>.</span>';
  }, { once: true });
  setTimeout(() => {
    if (note.classList.contains('is-hidden')) return;
    note.querySelector('span').textContent = 'Still working. On slower devices the scene can take a while to decode.';
  }, 20000);
</script>
</body>
