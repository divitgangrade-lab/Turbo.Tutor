<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" role="img" aria-labelledby="workerTitle workerDesc">
  <title id="workerTitle">A construction worker holding a large team gear sign</title>
  <desc id="workerDesc">A worker in a yellow hard hat and orange vest holds a big white sign reading UNDER CONSTRUCTION, TEAM GEAR DROP 01.</desc>
  <defs>
    <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9b21"/>
      <stop offset="1" stop-color="#ef6a00"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#eee8d9"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5f3c"/>
      <stop offset=".5" stop-color="#a9875b"/>
      <stop offset="1" stop-color="#6d5233"/>
    </linearGradient>
    <style>
      @keyframes workerBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes beacon { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
      .worker-bob { transform-box: fill-box; transform-origin: bottom center; animation: workerBob 4s ease-in-out infinite; }
      .worker-beacon { animation: beacon 1.2s steps(1, end) infinite; }
      @media (prefers-reduced-motion: reduce) { .worker-bob, .worker-beacon { animation: none; } }
    </style>
  </defs>

  <ellipse cx="230" cy="444" rx="180" ry="14" fill="#000" opacity=".14"/>

  <!-- post and sign -->
  <g>
    <rect x="300" y="188" width="14" height="248" rx="3" fill="url(#post)"/>
    <rect x="300" y="188" width="4" height="248" fill="#c2a173" opacity=".45"/>

    <rect x="138" y="16" width="314" height="202" rx="6" fill="url(#board)" stroke="#e10600" stroke-width="8"/>
    <rect x="150" y="28" width="290" height="178" rx="2" fill="none" stroke="#d7d0bf" stroke-width="2"/>
    <rect x="150" y="28" width="290" height="22" fill="#14181c"/>
    <g fill="#ffd400">
      <path d="M154 28 h22 l-15 22 h-22 z"/>
      <path d="M186 28 h22 l-15 22 h-22 z"/>
      <path d="M218 28 h22 l-15 22 h-22 z"/>
      <path d="M250 28 h22 l-15 22 h-22 z"/>
      <path d="M282 28 h22 l-15 22 h-22 z"/>
      <path d="M314 28 h22 l-15 22 h-22 z"/>
      <path d="M346 28 h22 l-15 22 h-22 z"/>
      <path d="M378 28 h22 l-15 22 h-22 z"/>
      <path d="M410 28 h22 l-15 22 h-22 z"/>
    </g>

    <text x="295" y="112" text-anchor="middle" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="1.5" fill="#14181c">UNDER</text>
    <text x="295" y="152" text-anchor="middle" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing=".6" fill="#e10600">CONSTRUCTION</text>
    <path d="M196 170 h198" stroke="#ddd5c4" stroke-width="2"/>
    <text x="295" y="192" text-anchor="middle" font-family="'Titillium Web', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#5b6367">TEAM GEAR · DROP 01</text>

    <g transform="translate(295 6)">
      <circle r="14" fill="#ffb000" opacity=".22"/>
      <g class="worker-beacon"><circle r="9" fill="#ffb000" stroke="#a35f00" stroke-width="2"/></g>
      <rect x="-10" y="9" width="20" height="7" rx="2" fill="#3a434b"/>
    </g>
  </g>

  <!-- worker -->
  <g class="worker-bob">
    <path d="M96 330 h30 v93 h-30 z" fill="#26303c"/>
    <path d="M140 330 h30 v93 h-30 z" fill="#2f3a47"/>
    <path d="M88 412 h46 v16 a8 8 0 0 1 -8 8 h-38 a8 8 0 0 1 -8 -8 z" fill="#14181c"/>
    <path d="M134 412 h46 v16 a8 8 0 0 1 -8 8 h-38 a8 8 0 0 1 -8 -8 z" fill="#14181c"/>
    <path d="M84 430 h54" stroke="#ffd400" stroke-width="4"/>

    <path d="M78 282 C84 260 112 250 140 250 C166 250 190 260 196 282 L202 334 L72 334 Z" fill="url(#vest)"/>
    <path d="M78 282 L96 250 L112 256 L92 306 Z" fill="#ffc46b" opacity=".7"/>
    <rect x="72" y="294" width="130" height="11" fill="#f7f5f0" opacity=".92"/>
    <rect x="72" y="316" width="130" height="11" fill="#f7f5f0" opacity=".92"/>

    <path d="M186 274 C214 272 240 280 262 292 L296 292 L296 308 L256 310 C230 306 208 300 190 296 Z" fill="#f26a00"/>
    <circle cx="298" cy="300" r="13" fill="#c98a63"/>
    <path d="M64 274 C48 276 38 288 36 304 L60 310 L72 292 Z" fill="#f26a00"/>
    <circle cx="38" cy="306" r="11" fill="#c98a63"/>

    <path d="M108 240 C108 218 170 218 170 240 L170 252 L108 252 Z" fill="#c98a63"/>
    <circle cx="139" cy="206" r="33" fill="#d99a72"/>
    <circle cx="110" cy="208" r="7" fill="#c98a63"/>
    <circle cx="168" cy="208" r="7" fill="#c98a63"/>
    <path d="M119 202 a4.5 4.5 0 1 0 .1 0 z M153 202 a4.5 4.5 0 1 0 .1 0 z" fill="#14181c"/>
    <path d="M126 220 C134 228 146 228 154 220" fill="none" stroke="#8d5535" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M124 190 c8 -5 20 -5 28 0" fill="none" stroke="#8d5535" stroke-width="3" stroke-linecap="round" opacity=".55"/>

    <path d="M100 188 C100 158 178 158 178 188 L178 196 L100 196 Z" fill="#ffc722"/>
    <path d="M92 194 h96 a4 4 0 0 1 0 9 h-96 a4 4 0 0 1 0 -9 z" fill="#ffb000"/>
    <path d="M100 188 C104 162 160 160 174 182" fill="none" stroke="#ffdd6b" stroke-width="4" opacity=".75"/>
  </g>

  <!-- cones and toolbox -->
  <g>
    <path d="M28 424 L44 398 L60 424 Z" fill="#ff7a00" stroke="#d95f00" stroke-width="2"/>
    <rect x="20" y="420" width="50" height="9" rx="2" fill="#ff7a00"/>
    <rect x="24" y="429" width="42" height="5" rx="2" fill="#d95f00" opacity=".7"/>
  </g>
  <g opacity=".9">
    <rect x="380" y="404" width="58" height="30" rx="3" fill="#e10600"/>
    <rect x="380" y="404" width="58" height="7" fill="#b00500"/>
    <rect x="390" y="416" width="34" height="4" rx="2" fill="#ffd400"/>
    <rect x="390" y="423" width="20" height="4" rx="2" fill="#ffd400" opacity=".7"/>
  </g>
</svg>
