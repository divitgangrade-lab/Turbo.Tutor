<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-labelledby="workerTitle">
  <title id="workerTitle">A little construction worker holding an UNDER CONSTRUCTION sign</title>
  <defs>
    <linearGradient id="vest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9b21"/>
      <stop offset="1" stop-color="#f26a00"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#efe9d8"/>
    </linearGradient>
    <style>
      @keyframes workerBob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-6px) rotate(-1.2deg); } }
      @keyframes beacon { 0%, 100% { opacity: 1; } 50% { opacity: .18; } }
      @keyframes signWobble { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(-.4deg); } }
      .worker-bob { transform-box: fill-box; transform-origin: bottom center; animation: workerBob 3.6s ease-in-out infinite; }
      .worker-beacon { animation: beacon 1.1s steps(1, end) infinite; }
      .worker-sign { transform-box: fill-box; transform-origin: bottom left; animation: signWobble 5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .worker-bob, .worker-beacon, .worker-sign { animation: none; } }
    </style>
  </defs>

  <ellipse cx="205" cy="406" rx="146" ry="13" fill="#000" opacity=".14"/>

  <g class="worker-sign">
    <rect x="240" y="152" width="14" height="212" rx="4" fill="#8a6a44"/>
    <rect x="240" y="152" width="5" height="212" fill="#a37f52" opacity=".7"/>
    <rect x="192" y="26" width="196" height="150" rx="8" fill="url(#board)" stroke="#e10600" stroke-width="7"/>
    <rect x="202" y="36" width="176" height="130" rx="4" fill="none" stroke="#d9d3c2" stroke-width="2"/>
    <rect x="202" y="36" width="176" height="14" fill="#14181c"/>
    <g fill="#ffd400">
      <path d="M202 36 h20 l-14 14 h-20 z"/>
      <path d="M232 36 h20 l-14 14 h-20 z"/>
      <path d="M262 36 h20 l-14 14 h-20 z"/>
      <path d="M292 36 h20 l-14 14 h-20 z"/>
      <path d="M322 36 h20 l-14 14 h-20 z"/>
      <path d="M352 36 h20 l-14 14 h-20 z"/>
      <path d="M382 36 h14 v14 h-20 z" opacity=".7"/>
    </g>
    <text x="290" y="86" text-anchor="middle" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="35" font-weight="900" fill="#14181c" letter-spacing="1">UNDER</text>
    <text x="290" y="118" text-anchor="middle" font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif" font-size="25" font-weight="900" fill="#e10600" letter-spacing=".2">CONSTRUCTION</text>
    <text x="290" y="143" text-anchor="middle" font-family="'Titillium Web', Arial, sans-serif" font-size="9" font-weight="700" fill="#5b6367" letter-spacing="2">TEAM GEAR · DROP 01</text>
    <g transform="translate(290 18)">
      <circle r="12" fill="#ffb000" opacity=".22"/>
      <g class="worker-beacon"><circle r="8" fill="#ffb000" stroke="#a35f00" stroke-width="2"/></g>
      <rect x="-9" y="8" width="18" height="7" rx="2" fill="#3a434b"/>
    </g>
  </g>

  <g class="worker-bob">
    <path d="M96 268 h30 v94 h-30 z" fill="#26303c"/>
    <path d="M140 268 h30 v94 h-30 z" fill="#2f3a47"/>
    <path d="M88 352 h46 v20 a8 8 0 0 1 -8 8 h-38 a8 8 0 0 1 -8 -8 z" fill="#14181c"/>
    <path d="M134 352 h46 v20 a8 8 0 0 1 -8 8 h-38 a8 8 0 0 1 -8 -8 z" fill="#14181c"/>
    <path d="M86 372 h52" stroke="#ffd400" stroke-width="4"/>

    <path d="M78 214 C84 194 112 184 140 184 C166 184 190 194 196 214 L204 276 L70 276 Z" fill="url(#vest)"/>
    <path d="M78 214 L96 184 L112 190 L92 240 Z" fill="#ffc46b" opacity=".75"/>
    <rect x="72" y="228" width="130" height="12" fill="#f7f5f0" opacity=".92"/>
    <rect x="72" y="252" width="130" height="12" fill="#f7f5f0" opacity=".92"/>
    <path d="M120 184 L120 276" stroke="#d95f00" stroke-width="3" opacity=".55"/>

    <path d="M186 208 C208 206 224 216 232 232 L246 248 L226 266 L208 246" fill="#f26a00"/>
    <path d="M64 208 C48 210 38 222 36 238 L42 252 L62 244" fill="#f26a00"/>
    <circle cx="244" cy="260" r="14" fill="#c98a63"/>
    <circle cx="44" cy="240" r="12" fill="#c98a63"/>

    <path d="M108 174 C108 152 170 152 170 174 L170 186 L108 186 Z" fill="#c98a63"/>
    <circle cx="139" cy="140" r="34" fill="#d99a72"/>
    <circle cx="110" cy="142" r="7" fill="#c98a63"/>
    <circle cx="168" cy="142" r="7" fill="#c98a63"/>
    <path d="M118 136 a5 5 0 1 0 .1 0 z M154 136 a5 5 0 1 0 .1 0 z" fill="#14181c"/>
    <path d="M126 154 C134 162 146 162 154 154" fill="none" stroke="#8d5535" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M124 124 c8 -5 20 -5 28 0" fill="none" stroke="#8d5535" stroke-width="3" stroke-linecap="round" opacity=".6"/>

    <path d="M100 122 C100 92 178 92 178 122 L178 130 L100 130 Z" fill="#ffc722"/>
    <path d="M92 128 h96 a4 4 0 0 1 0 9 h-96 a4 4 0 0 1 0 -9 z" fill="#ffb000"/>
    <rect x="133" y="98" width="12" height="26" rx="3" fill="#f7f5f0" opacity=".55"/>
    <path d="M100 122 C104 96 160 94 174 116" fill="none" stroke="#ffdd6b" stroke-width="4" opacity=".8"/>
  </g>

  <g>
    <path d="M40 360 L58 330 L76 360 Z" fill="#ff7a00" stroke="#d95f00" stroke-width="2"/>
    <rect x="30" y="356" width="56" height="10" rx="3" fill="#ff7a00"/>
    <rect x="34" y="366" width="48" height="6" rx="3" fill="#d95f00" opacity=".7"/>
    <path d="M44 344 h24" stroke="#fff3e0" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g opacity=".85">
    <rect x="310" y="330" width="62" height="34" rx="3" fill="#e10600"/>
    <rect x="310" y="330" width="62" height="8" fill="#b00500"/>
    <rect x="322" y="342" width="38" height="4" rx="2" fill="#ffd400"/>
    <rect x="322" y="350" width="24" height="4" rx="2" fill="#ffd400" opacity=".7"/>
  </g>
</svg>
